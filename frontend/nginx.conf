# nginx site config for the Destiny SPA container.
#
# Two responsibilities only: serve the immutable Vite build with a client-side
# routing fallback, and proxy the versioned API to the backend service so the
# browser talks to a single origin (no CORS, no absolute API base in the bundle).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # The API lives on the backend service; the URI is forwarded unchanged, so
    # /api/v1/health reaches FastAPI's own /api/v1/health route.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed asset file names change with their content and may be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell must be revalidated, otherwise clients stay pinned to an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Deep links such as /bazi-natal are React Router routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
